name: Diagnose Sonar annotations

on:
  push:
    branches:
      - codex/expected-sp-probe

jobs:
  annotations:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Fetch Sonar annotations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: '111520849989'
        run: |
          set -euo pipefail
          gh api "/repos/${REPO}/check-runs/${CHECK_RUN_ID}/annotations" --paginate
