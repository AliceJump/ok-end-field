name: Download Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: ${{ github.repository_owner == 'AliceJump' }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: |
          python -m pip install --only-binary :all: requests==2.32.4

      - name: generate svg
        run: python scripts/download_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit to branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add assets/downloads.svg

          if ! git diff --cached --quiet; then
            BRANCH="chore/update-download-stats-$(date -u +%Y%m%d%H%M%S)"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            git checkout -b "$BRANCH"
            git commit -m "update download stats"
          fi

      - name: push branch and open PR
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.commit.outputs.branch }}"
          git push -u origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "chore: update download stats" \
            --body "由 download_stats 工作流自动生成的下载统计更新。"
          echo "Created new PR for $BRANCH"
          # 启用 auto-merge：checks 通过后自动 squash 合并（master ruleset approval=0）
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            --subject "chore: update download stats" \
            --body "由 download_stats 工作流自动生成的下载统计更新。"
          echo "Auto-merge enabled for $BRANCH"
