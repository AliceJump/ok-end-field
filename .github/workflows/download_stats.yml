name: Download Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository_owner == 'AliceJump' }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: |
          python -m pip install --only-binary :all: requests==2.32.4

      - name: generate svg
        run: python scripts/download_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add assets/downloads.svg

          if ! git diff --cached --quiet; then
            git commit -m "update download stats"
            git push
          fi
