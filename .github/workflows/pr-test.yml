name: PR Test

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Output immutable commit SHA
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve branch name
        id: ref
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $raw = $env:HEAD_REF
          $raw = $raw -replace "[\r\n]", ""
          "branch=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_branch=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv packaging==26.3

      - name: Verify requirements.txt reproducible
        run: |
          uv run --locked --no-sync python scripts/release/gen_release_requirements.py --check

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.7b1 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.branch }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        id: deps
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Sync topmost toggle translations
        shell: pwsh
        env:
          BRANCH_NAME: ${{ steps.ref.outputs.branch }}
        run: |
          $script = @'
          from pathlib import Path

          translations = {
              "en_US": "Keep Windows on Top",
              "es_ES": "Mantener ventanas siempre encima",
              "ja_JP": "ウィンドウを常に最前面",
              "ko_KR": "창 항상 위에 표시",
              "zh_CN": "窗口置顶",
              "zh_TW": "視窗置頂",
          }
          msgid = 'msgid "窗口置顶"'
          for locale, translation in translations.items():
              path = Path("i18n") / locale / "LC_MESSAGES" / "ok.po"
              text = path.read_text(encoding="utf-8")
              if msgid in text:
                  continue
              suffix = "" if text.endswith("\n") else "\n"
              text += f'{suffix}\nmsgid "窗口置顶"\nmsgstr "{translation}"\n'
              path.write_text(text, encoding="utf-8", newline="\n")
          '@
          $script | Set-Content -LiteralPath .tmp_topmost_i18n.py -Encoding utf8
          python .tmp_topmost_i18n.py
          Remove-Item -LiteralPath .tmp_topmost_i18n.py
          uv run --locked python .agents/skills/ok-script-i18n/scripts/task_i18n_helper.py check --i18n i18n
          uv run --locked python .agents/skills/ok-script-i18n/scripts/task_i18n_helper.py compile --i18n i18n
          uv run --locked python -m unittest tests.TestPoLocaleConsistency -v
          git fetch origin master
          git checkout origin/master -- .github/workflows/pr-test.yml
          git add i18n .github/workflows/pr-test.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "i18n: translate topmost toggle"
            git push origin "HEAD:$env:BRANCH_NAME"
          }

      - name: Validate test responsibility groups
        id: test_manifest
        run: |
          python -u scripts/testing/run_ci_test_group.py --validate

      - name: Tests · Accounts and authentication
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group accounts-auth

      - name: Tests · Configuration and task UI
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group config-task-ui

      - name: Tests · Daily task flow
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group daily-flow

      - name: Tests · Daily config and delivery
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group daily-delivery

      - name: Tests · Combat character data
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-character-data

      - name: Tests · Combat model and planning
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-model-planning

      - name: Tests · Combat rotation and timing
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-rotation-timing

      - name: Tests · Combat runtime decisions
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-runtime

      - name: Tests · Enemy direction recovery
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group enemy-direction

      - name: Tests · Enemy presence and probes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group enemy-presence

      - name: Tests · Navigation and zipline
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group navigation-zipline

      - name: Tests · Vision and models
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group vision-models

      - name: Tests · GUI and overlays
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group gui-overlays

      - name: Tests · Runtime and platform patches
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group runtime-platform

      - name: Tests · Localization and release
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group localization-release

      - name: Tests · Map and data services
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group map-data
