name: PR Test

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Output immutable commit SHA
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve branch name
        id: ref
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $raw = $env:HEAD_REF
          $raw = $raw -replace "[\r\n]", ""
          "branch=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_branch=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv packaging==26.3

      - name: Verify requirements.txt reproducible
        run: |
          uv run --locked --no-sync python scripts/release/gen_release_requirements.py --check

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.7b1 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.branch }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        id: deps
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Validate test responsibility groups
        id: test_manifest
        run: |
          python -u scripts/testing/run_ci_test_group.py --validate

      - name: Tests · Accounts and authentication
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group accounts-auth

      - name: Tests · Configuration and task UI
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group config-task-ui

      - name: Tests · Daily task flow
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group daily-flow

      - name: Tests · Daily config and delivery
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group daily-delivery

      - name: Tests · Combat character data
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-character-data

      - name: Tests · Combat model and planning
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-model-planning

      - name: Tests · Combat rotation and timing
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-rotation-timing

      - name: Tests · Combat runtime decisions
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group combat-runtime

      - name: Tests · Enemy direction recovery
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
