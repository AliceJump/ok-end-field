          python -u scripts/testing/run_ci_test_group.py --group enemy-presence

      - name: Tests · Navigation and zipline
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group navigation-zipline

      - name: Tests · Vision and models
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group vision-models

      - name: Tests · GUI and overlays
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
