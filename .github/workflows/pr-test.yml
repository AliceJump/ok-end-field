          python -u scripts/testing/run_ci_test_group.py --group enemy-direction

      - name: Tests · Enemy presence and probes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
