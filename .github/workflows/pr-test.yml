          python -u scripts/testing/run_ci_test_group.py --group gui-overlays

      - name: Tests · Runtime and platform patches
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group runtime-platform

      - name: Tests · Localization and release
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group localization-release

      - name: Tests · Map and data services
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.test_manifest.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -u scripts/testing/run_ci_test_group.py --group map-data
