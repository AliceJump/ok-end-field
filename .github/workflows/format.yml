name: Format

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    if: ${{ github.repository_owner == 'AliceJump' }}
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: install uv
        run: "pip install --only-binary :all: uv==0.12.5"

      - name: install deps
        run: uv sync --locked --only-group dev

      - name: ruff check fix and format
        run: |
          uv run --locked ruff check --fix .
          uv run --locked ruff format .

      - name: commit to branch
        id: commit
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $BRANCH = "style/format-$((Get-Date).ToUniversalTime().ToString('yyyyMMddHHmmss'))"
            "branch=$BRANCH" >> $env:GITHUB_OUTPUT

            git checkout -b $BRANCH
            git commit -m "chore: ruff format"
          }

      - name: push branch and open PR
        if: steps.commit.outputs.branch != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $BRANCH = "${{ steps.commit.outputs.branch }}"

          git push -u origin $BRANCH

          gh pr create `
            --base master `
            --head $BRANCH `
            --title "style: format files" `
            --body "由 format 工作流自动生成的代码格式化更新。"

          Write-Host "Created new PR for $BRANCH"

          # 启用 auto-merge：checks 通过后自动 squash 合并（master ruleset approval=0）。
          # PR 已是 clean status（无待等待的 check）时 enablePullRequestAutoMerge 会被拒绝，
          # 此时所有合并条件已满足，直接合并即可。
          gh pr merge $BRANCH `
            --auto `
            --squash `
            --delete-branch `
            --subject "style: format files" `
            --body "由 format 工作流自动生成的代码格式化更新。"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Auto-merge unavailable (clean status), merging directly"

            gh pr merge $BRANCH `
              --squash `
              --delete-branch `
              --subject "style: format files" `
              --body "由 format 工作流自动生成的代码格式化更新。"
          }

          Write-Host "Merged or auto-merge enabled for $BRANCH"