[project]
name = "ok-end-field"
version = "0.1.0"
description = "Endfield game automation built on ok-script"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ok-script==2.0.4",
    "PySide6-Essentials==6.11.1",
    "PySide6-Fluent-Widgets==1.10.5",
    "PySideSix-Frameless-Window==0.7.3",
    "onnxocr-ppocrv5==0.0.14",
    "openvino==2026.0.0",
    "opencv-python==4.12.0.88",
    "websocket-client==1.9.0",
    "websockets==15.0.1",
    "json5==0.15.0",
    "pynput==1.8.2",
    "imagehash==4.3.2",
    "pyautogui==0.9.54",
    "cryptography>=44.0.0",
    "scikit-image==0.26.0",
]

[dependency-groups]
dev = [
    "polib",
]

[tool.uv]
package = false

[tool.ruff.lint]
allowed-confusables = ["，", "。", "；", "：", "（", "）", "、"]
