inheritance: true

reviews:
  path_instructions:
    - path: "**"
      instructions: |
        评审规则：职责边界与 PR 范围。

        1. 按“独立的修改原因”判断职责边界。
           不得仅因文件长、函数多或代码行数增加，就判定违反单一职责。

        2. 检查核心业务逻辑是否混入可独立变化的诊断实现，
           包括实时叠层、图像标注、文件格式、文件保存、线程和队列管理。
           核心模块可以产出诊断证据，并调用独立诊断模块；
           不应同时实现这些诊断机制。
           正常的配置注册和必要的流程编排，不视为职责混乱。

        3. 诊断功能不得改变核心判定结果或状态推进。
           诊断失败不得阻断核心流程。
           对高频调用路径，应检查复制、标注和入队等同步开销；
           不得将“异步写盘”等同于“全部诊断工作异步执行”。

        4. 对照 PR 标题和描述检查实际变更范围。
           若 PR 声称仅增加日志、调试或可视化，
           却修改阈值、候选筛选、扫描调度或状态语义，应指出范围不一致。
           若这些变更服务于同一目标，且描述明确、测试分别覆盖，
           不得仅因同时涉及多个模块就要求拆分 PR。

        5. 提出职责边界问题时，必须列出具体函数或模块、
           至少两个独立修改原因，以及实际维护、测试或运行风险。
           建议最小可行拆分，不要求无必要的类、接口或设计模式。

        6. 优先评审本 PR 新增或加重的职责耦合。
           不要求本 PR 顺带重构无关的历史代码。

  pre_merge_checks:
    custom_checks:
      - name: "PR 范围一致性"
        mode: warning
        instructions: |
          对照 PR 标题、描述和实际 diff 检查范围一致性。

          Pass：实际行为变化均已在 PR 标题或描述中明确披露，或者 PR 只包含其声明的范围。

          Fail：PR 声称仅增加诊断、日志或可视化，但实际修改核心判定规则、阈值、候选筛选、调度、状态语义、持久化语义或公开契约，且描述未披露这些行为变化。

          失败时必须列出具体变更位置和未披露的行为变化。不得仅因涉及多个文件、模块或职责名称就判定失败。
