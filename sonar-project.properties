sonar.projectKey=AliceJump_ok-end-field
sonar.organization=alicejump

# ============================================================
# 源码目录 — 只扫描真正需要分析的 Python 源码
# ============================================================
sonar.sources=src

# ============================================================
# 排除的非源码目录/文件
# ============================================================
sonar.exclusions=\
  ok_templates/**,\
  assets/**,\
  screenshots/**,\
  icons/**,\
  images/**,\
  cache/**,\
  logs/**,\
  docs/**,\
  configs/**,\
  i18n/**,\
  scripts/**,\
  tools/**,\
  target_doc/**, \
  **/*.md,\
  **/*.json,\
  **/*.csv,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.svg,\
  **/*.ico,\
  **/*.yml,\
  **/*.yaml,\
  **/*.ps1,\
  **/*.sh

# ============================================================
# 测试目录
# ============================================================
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# ============================================================
# Python 配置
# ============================================================
sonar.python.version=3.12

# ============================================================
# 排除的告警规则（项目确认的误报）
# 规则 ID 请从 SonarCloud 界面获取后填入
# ============================================================
# sonar.issue.ignore.multicriteria=e1,e2
