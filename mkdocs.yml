  - 项目首页: index.md
  - 简体中文:
    - 文档首页: zh-CN/index.md
    - 开始使用:
      - 安装: zh-CN/getting-started/installation.md
      - 使用前配置: zh-CN/getting-started/configuration.md
      - 快速上手: zh-CN/guides/quick-start.md
      - 常见问题: zh-CN/guides/troubleshooting.md
    - 功能指南:
      - 功能概览: zh-CN/features/overview.md
      - 日常任务: zh-CN/日常任务.md
      - 刷体力: zh-CN/体力本.md
      - 自动战斗: zh-CN/自动战斗.md
